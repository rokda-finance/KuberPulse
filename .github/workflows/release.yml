name: Release KuberPulse

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag label (e.g. v1.0.0-alpha.1)'
        required: false
        default: 'v1.0.0-alpha.1'

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build Frontend & Backend Bundle
        run: npm run build:desktop

  build-installers:
    name: Build Desktop (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            script: npm run dist:linux -- --publish never
          - os: windows-latest
            platform: win
            script: npm run dist:win -- --publish never
          - os: macos-latest
            platform: mac
            script: npm run dist:mac -- --publish never

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build ${{ matrix.platform }} installer
        run: ${{ matrix.script }}

      - name: Upload ${{ matrix.platform }} release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kuberpulse-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build-installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: KuberPulse ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            artifacts/**/*
